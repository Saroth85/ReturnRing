# Static server for the UI bundle with SPA fallback. /api, /healthz and /readyz never reach this
# server: the Caddy proxy sends them to the API (infra/Caddyfile).
#
# Security headers are repeated in each location because nginx drops inherited add_header
# directives in any block that sets its own. The CSP keeps every request on the origin (rule 2,
# no CDN, no webfont); inline styles are allowed for computed positions (popovers, charts, graph).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (/queue, /returns/RET-000102, ...) all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
