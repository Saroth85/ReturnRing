# Benchmarks B1-B4 on the MI300X droplet (US-902, docs/benchmarks.md). Used on top of the gpu files:
#   docker compose -f infra/docker-compose.yml -f infra/compose.gpu.yml -f infra/compose.bench.yml \
#     --env-file .env --profile gpu ...
# Use the Makefile targets (make bench DEVICE=gpu). `bench` is an offline job like the trainers:
# it reads the raw ASOS tables only (never data/truth: B4 generates its own store, truth included,
# under bench-work/, which no running service mounts, and deletes that truth when it is done).
# The code is mounted read-only, never the whole repository; results and raw outputs are the only
# writable mounts. vLLM is reached on the compose network (no published port, NFR-11).
x-bench-env: &bench-env
  DEVICE: gpu
  SEED: ${SEED:-42}
  PYTHONDONTWRITEBYTECODE: "1"
  BENCH_GIT_COMMIT: ${BENCH_GIT_COMMIT:-}
  BENCH_GIT_DIRTY: ${BENCH_GIT_DIRTY:-}
  VLLM_IMAGE: ${VLLM_IMAGE:-}
  DGL_IMAGE: ${DGL_IMAGE:-}
  ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:-}
  GEMMA_MODEL: ${GEMMA_MODEL:-}
  GEMMA_REVISION: ${GEMMA_REVISION:-}

services:
  bench:
    build:
      context: ..
      dockerfile: infra/docker/bench.Dockerfile
      args:
        ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:?set ROCM_BASE_IMAGE in .env (tag@sha256, see .env.example)}
        AMD_PYPI_INDEX_URL: ${AMD_PYPI_INDEX_URL:?set AMD_PYPI_INDEX_URL in .env (see .env.example)}
    profiles: [bench]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    security_opt:
      - seccomp=unconfined
    shm_size: 16g
    working_dir: /app
    environment:
      <<: *bench-env
      LLM_MODE: vllm
      VLLM_BASE_URL: http://vllm:8001/v1
      VLLM_API_KEY: ${VLLM_API_KEY}
    volumes:
      - ../bench:/app/bench:ro
      - ../bench/results:/app/bench/results
      - ../ml:/app/ml:ro
      - ../pipeline:/app/pipeline:ro
      - ../contracts:/app/contracts:ro
      - ../llm:/app/llm:ro
      - ../policy:/app/policy:ro
      - ../data/raw:/app/data/raw:ro
      - ../artifacts:/app/artifacts
      - ../bench-work:/app/bench-work

  # B2 runs in trainer-graphsage (rocm/dgl plus what ml.gnn imports, US-202): ml.gnn.b2_timing
  # runs the US-202 job there, so B2 and US-202 train once per device. The code is mounted
  # read-only over the copy built into the image (a code change needs no rebuild); data/raw and
  # artifacts/ come from docker-compose.yml.
  trainer-graphsage:
    environment:
      <<: *bench-env
    volumes:
      - ../bench:/app/bench:ro
      - ../ml:/app/ml:ro
      - ../pipeline:/app/pipeline:ro
      - ../contracts:/app/contracts:ro
      - ../policy:/app/policy:ro
