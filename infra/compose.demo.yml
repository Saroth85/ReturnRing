# demo profile switches (public CPU server, results precomputed on the MI300X).
#   docker compose -f infra/docker-compose.yml -f infra/compose.demo.yml --env-file .env --profile demo ...
# The values here win over the laptop .env: no GPU, no vLLM, cached outputs only.
services:
  api:
    environment:
      DEVICE: cpu
      LLM_MODE: mock
      DEMO_MODE: cached
