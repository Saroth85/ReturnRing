# gpu profile switches (MI300X droplet). Always used together with docker-compose.yml:
#   docker compose -f infra/docker-compose.yml -f infra/compose.gpu.yml --env-file .env --profile gpu ...
# (make gpu-up adds -f infra/compose.public.yml: HTTPS on PUBLIC_HOST and basic auth.)
# The values here win over the laptop .env (Compose merges mappings key by key), and the GPU
# images and the AMD index must be set: a missing value stops Compose with the message below.
services:
  api:
    environment:
      DEVICE: gpu
      LLM_MODE: vllm
      DEMO_MODE: live

  # The reset drafts every open return with Gemma on the local vLLM (flow F1), so it waits for
  # vLLM to be healthy.
  reset:
    environment:
      DEVICE: gpu
      LLM_MODE: vllm
      DEMO_MODE: live
    depends_on:
      vllm:
        condition: service_healthy

  vllm:
    image: ${VLLM_IMAGE:?set VLLM_IMAGE in .env (tag@sha256, see .env.example)}
    environment:
      # Guard only: the revision is passed on the vllm command line (docker-compose.yml).
      GEMMA_REVISION: ${GEMMA_REVISION:?set GEMMA_REVISION in .env (commit sha, see .env.example)}

  trainer-gbm:
    build:
      args:
        ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:?set ROCM_BASE_IMAGE in .env (tag@sha256, see .env.example)}
        AMD_PYPI_INDEX_URL: ${AMD_PYPI_INDEX_URL:?set AMD_PYPI_INDEX_URL in .env (see .env.example)}

  trainer-gnn:
    image: ${DGL_IMAGE:?set DGL_IMAGE in .env (tag@sha256, see .env.example)}

  trainer-graphsage:
    environment:
      DEVICE: gpu
    build:
      args:
        DGL_IMAGE: ${DGL_IMAGE:?set DGL_IMAGE in .env (tag@sha256, see .env.example)}

  telemetry:
    build:
      args:
        ROCM_BASE_IMAGE: ${ROCM_BASE_IMAGE:?set ROCM_BASE_IMAGE in .env (tag@sha256, see .env.example)}
