# GPU spikes SPK-G1..G7 only (infra/spikes/README.md). Used on top of the gpu files:
#   docker compose -f infra/docker-compose.yml -f infra/compose.gpu.yml -f infra/compose.spike.yml \
#     --env-file .env --profile gpu ...
# Adds read-only mounts of the spike scripts to the trainers, and a stdlib Python client that talks
# to vLLM on the internal network, so vLLM never needs a published port (NFR-11).
services:
  trainer-gbm:
    volumes:
      - ../infra/spikes:/app/infra/spikes:ro

  trainer-gnn:
    volumes:
      - ../infra/spikes:/app/infra/spikes:ro

  spike-client:
    # python:3.12-slim, multi-arch index digest read from registry-1.docker.io on 13 Oct 2026.
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    profiles: [spike]
    working_dir: /app
    environment:
      VLLM_BASE_URL: http://vllm:8001/v1
      VLLM_API_KEY: ${VLLM_API_KEY}
      GEMMA_MODEL: ${GEMMA_MODEL}
    volumes:
      - ../infra/spikes:/app/infra/spikes:ro
      - ../contracts/json:/app/contracts/json:ro
      - ../artifacts:/app/artifacts
